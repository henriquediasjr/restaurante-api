spring:
  application:
    name: authserver
  web:
    error:
      whitelabel:
        enabled: false
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      include-exception: true
  datasource:
    url: jdbc:h2:mem:db
    username: sa
    password: sa
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    use-root-path: true

logging:
  file:
    path: ./logs
